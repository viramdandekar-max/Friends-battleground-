
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.4.1-stable"

          wget -q "$BASE/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          sudo install -m 755 Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot

          wget -q "$BASE/Godot_v4.4.1-stable_export_templates.tpz"
          unzip -q Godot_v4.4.1-stable_export_templates.tpz

          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -a templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

          godot --headless --version

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -f "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -f "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Configure Android export
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build "$HOME/.android"
          mkdir -p "$HOME/.config/godot"

          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          godot --headless --editor --path . --quit

          python3 - <<'PY'
          import os
          import re
          import json
          from pathlib import Path

          settings = Path.home() / ".config/godot/editor_settings-4.4.tres"

          if settings.exists():
              content = settings.read_text()
          else:
              content = (
                  '[gd_resource type="EditorSettings" format=3]\n'
                  '\n[resource]\n'
              )

          if "[resource]" not in content:
              raise SystemExit("Invalid Godot editor settings")

          values = {
              "export/android/android_sdk_path":
                  os.environ["ANDROID_SDK_ROOT"],
              "export/android/java_sdk_path":
                  os.environ["JAVA_HOME"],
              "export/android/debug_keystore":
                  str(Path.home() / ".android/debug.keystore"),
              "export/android/debug_keystore_user":
                  "androiddebugkey",
              "export/android/debug_keystore_pass":
                  "android",
          }

          for key, value in values.items():
              content = re.sub(
                  r"(?m)^" + re.escape(key) + r"\s*=.*\n",
                  "",
                  content,
              )

          additions = "".join(
              f"{key} = {json.dumps(value)}\n"
              for key, value in values.items()
          )

          content = content.replace(
              "[resource]",
              "[resource]\n" + additions,
              1,
          )

          settings.parent.mkdir(parents=True, exist_ok=True)
          settings.write_text(content)

          print("Godot editor settings configured:", settings)
          PY

      - name: Export Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail

          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"

          godot --headless --path . \
            --export-debug "Android" \
            build/FriendsBattleGround.apk

          test -s build/FriendsBattleGround.apk

          echo "APK build completed"
          ls -lh build/FriendsBattleGround.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendsBattleGround-APK
          path: build/FriendsBattleGround.apk
          if-no-files-found: error
          
