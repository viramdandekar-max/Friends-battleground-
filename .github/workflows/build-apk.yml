name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android paths
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

          test -d "$ANDROID_SDK_ROOT"
          test -d "$JAVA_HOME"

          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "Java JDK: $JAVA_HOME"

      - name: Install Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.4.1-stable"

          wget -q "$BASE/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          sudo install -m 755 Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot

          wget -q "$BASE/Godot_v4.4.1-stable_export_templates.tpz"
          unzip -q Godot_v4.4.1-stable_export_templates.tpz

          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -a templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

          godot --headless --version

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -f "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -f "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Generate debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" build

          keytool -genkeypair \
            -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -s "$HOME/.android/debug.keystore"

      - name: Configure Godot paths
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --editor --path . --quit

          python3 - <<'PY'
          import os
          import re
          import json
          from pathlib import Path

          home = Path.home()
          settings_dir = home / ".config/godot"
          settings_dir.mkdir(parents=True, exist_ok=True)

          values = {
              "export/android/android_sdk_path": os.environ["ANDROID_SDK_ROOT"],
              "export/android/java_sdk_path": os.environ["JAVA_HOME"],
              "export/android/debug_keystore": str(home / ".android/debug.keystore"),
              "export/android/debug_keystore_user": "androiddebugkey",
              "export/android/debug_keystore_pass": "android",
          }

          candidates = [
              settings_dir / "editor_settings-4.tres",
              settings_dir / "editor_settings-4.4.tres",
          ]

          for settings in candidates:
              if settings.exists():
                  data = settings.read_text()
              else:
                  data = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'

              if "[resource]" not in data:
                  raise SystemExit(f"Invalid editor settings: {settings}")

              for key in values:
                  data = re.sub(
                      r"(?m)^" + re.escape(key) + r"\s*=.*(?:\n|$)",
                      "",
                      data
                  )

              additions = "".join(
                  f"{key} = {json.dumps(value)}\n"
                  for key, value in values.items()
              )

              data = data.replace(
                  "[resource]",
                  "[resource]\n" + additions,
                  1
              )

              settings.write_text(data)
              print("Configured:", settings)

          preset = Path("export_presets.cfg")
          if not preset.exists():
              raise SystemExit("Missing export_presets.cfg")

          data = preset.read_text()

          replacements = {
              "keystore/debug": str(home / ".android/debug.keystore"),
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
          }

          for key, value in replacements.items():
              pattern = r"(?m)^" + re.escape(key) + r"\s*=.*$"
              if not re.search(pattern, data):
                  raise SystemExit(f"Missing preset option: {key}")
              data = re.sub(
                  pattern,
                  lambda m: key + "=" + json.dumps(value),
                  data
              )

          preset.write_text(data)
          print("Android export preset configured")
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_SDK_ROOT/platform-tools/adb" start-server

          mkdir -p build

          godot --headless --path . \
            --export-debug "Android" \
            build/FriendsBattleGround.apk

          test -s build/FriendsBattleGround.apk

          echo "APK CREATED"
          ls -lh build/FriendsBattleGround.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendsBattleGround-APK
          path: build/FriendsBattleGround.apk
          if-no-files-found: error
          
