name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot and templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot/releases/download/4.4.1-stable

          wget -q "$BASE/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          sudo install -m755 Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot

          wget -q "$BASE/Godot_v4.4.1-stable_export_templates.tpz"
          unzip -q Godot_v4.4.1-stable_export_templates.tpz

          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -a templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"

      - name: Install Godot 4.4 Android requirements
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            'platform-tools' \
            'build-tools;34.0.0' \
            'platforms;android-34' \
            'cmdline-tools;latest' \
            'cmake;3.10.2.4988404' \
            'ndk;23.2.8568313'

          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -f "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          test -d "$JAVA_HOME"

      - name: Configure Godot editor and signing
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build "$HOME/.android" "$HOME/.config/godot"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          home = Path.home()
          settings = home / '.config/godot/editor_settings-4.4.tres'

          if settings.exists():
              data = settings.read_text()
          else:
              data = (
                  '[gd_resource type="EditorSettings" format=3]\n'
                  '\n[resource]\n'
              )

          assert '[resource]' in data

          values = {
              'export/android/android_sdk_path': os.environ['ANDROID_SDK_ROOT'],
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
              'export/android/debug_keystore': str(home / '.android/debug.keystore'),
              'export/android/debug_keystore_user': 'androiddebugkey',
              'export/android/debug_keystore_pass': 'android',
          }

          for key in values:
              data = re.sub(
                  r'(?m)^' + re.escape(key) + r'\s*=.*$',
                  '',
                  data
              )

          additions = ''.join(
              key + ' = ' + json.dumps(value) + '\n'
              for key, value in values.items()
          )

          data = data.replace(
              '[resource]',
              '[resource]\n' + additions,
              1
          )

          settings.write_text(data)

          preset = Path('export_presets.cfg')
          content = preset.read_text()

          replacements = {
              'keystore/debug': str(home / '.android/debug.keystore'),
              'keystore/debug_user': 'androiddebugkey',
              'keystore/debug_password': 'android',
              'version/target_sdk': '34',
          }

          for key, value in replacements.items():
              pattern = r'(?m)^' + re.escape(key) + r'=.*$'

              assert re.search(pattern, content), (
                  'Missing export option: ' + key
              )

              replacement = (
                  value if key == 'version/target_sdk'
                  else json.dumps(value)
              )

              content = re.sub(
                  pattern,
                  lambda match: key + '=' + replacement,
                  content
              )

          preset.write_text(content)

          print('SDK:', os.environ['ANDROID_SDK_ROOT'])
          print('Java:', os.environ['JAVA_HOME'])
          print('Editor settings:', settings)
          PY

          godot --headless --editor --path . --import --quit

      - name: Export and verify APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail

          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"

          godot --headless --verbose --path . \
            --export-debug Android \
            build/FriendsBattleGround.apk

          test -s build/FriendsBattleGround.apk

          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" \
            verify build/FriendsBattleGround.apk

          ls -lh build/FriendsBattleGround.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendsBattleGround-APK
          path: build/FriendsBattleGround.apk
          if-no-files-found: error
          
