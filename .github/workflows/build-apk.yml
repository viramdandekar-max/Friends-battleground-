
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.4.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          sudo install -m 755 Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -r templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Godot Android export
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit
          mkdir -p build "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          settings = Path.home() / '.config/godot/editor_settings-4.tres'
          if not settings.exists():
              raise SystemExit(f'Missing Godot editor settings: {settings}')
          data = settings.read_text()
          if '[resource]' not in data:
              raise SystemExit('Missing [resource] section in Godot settings')
          values = {
              'export/android/android_sdk_path': os.environ['ANDROID_SDK_ROOT'],
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
              'export/android/debug_keystore': str(Path.home() / '.android/debug.keystore'),
              'export/android/debug_keystore_user': 'androiddebugkey',
              'export/android/debug_keystore_pass': 'android',
          }
          for key in values:
              data = re.sub(r'(?m)^' + re.escape(key) + r'\s*=.*\n', '', data)
          block = '\n' + ''.join(f'{key} = {json.dumps(value)}\n' for key, value in values.items())
          settings.write_text(data.replace('[resource]', '[resource]' + block, 1))
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --export-debug "Android" build/FriendsBattleGround.apk
          test -s build/FriendsBattleGround.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendsBattleGround-APK
          path: build/FriendsBattleGround.apk
          if-no-files-found: error
          
