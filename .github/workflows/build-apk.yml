name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot & Templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.3"
          BASE="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"

          wget -q "$BASE/Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${VERSION}-stable_linux.x86_64.zip"
          sudo install -m755 "Godot_v${VERSION}-stable_linux.x86_64" /usr/local/bin/godot

          wget -q "$BASE/Godot_v${VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${VERSION}-stable_export_templates.tpz"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a templates/. "$TEMPLATE_DIR/"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Generate Debug Keystore
        shell: bash
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12
          
          # export_presets.cfg me keystore path inject karein
          sed -i 's|keystore/debug=""|keystore/debug="'"$PWD"'/debug.keystore"|' export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|' export_presets.cfg

      - name: Import Godot Project
        run: |
          godot --headless --path . --editor --quit || true

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/FriendsBattleGround.apk
          test -s build/FriendsBattleGround.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendsBattleGround-APK
          path: build/FriendsBattleGround.apk
          if-no-files-found: error
