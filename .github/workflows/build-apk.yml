name: build-apk.yml

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.4.1 and Android templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/4.4.1-stable
          wget -q "$base/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          sudo install -m 755 Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          rm Godot_v4.4.1-stable_linux.x86_64.zip

          wget -q "$base/Godot_v4.4.1-stable_export_templates.tpz"
          unzip -q Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -a templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          rm -rf templates Godot_v4.4.1-stable_export_templates.tpz

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses || true
          "$sdkmanager" --install 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'

      - name: Configure Keystore and Editor Settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build "$HOME/.android" "$HOME/.config/godot"

          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'

          cat <<EOF > "$HOME/.config/godot/editor_settings-4.tres"
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
export/android/java_sdk_path = "$JAVA_HOME"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
export/android/shutdown_adb_on_exit = false
EOF

          python3 - <<'PY'
          import re
          from pathlib import Path

          preset = Path('export_presets.cfg')
          if not preset.exists():
              raise SystemExit("Error: export_presets.cfg file nahi mili!")

          data = preset.read_text()
          data = re.sub(r'keystore/debug\s*=.*', f'keystore/debug="{Path.home()}/.android/debug.keystore"', data)
          data = re.sub(r'keystore/debug_user\s*=.*', 'keystore/debug_user="androiddebugkey"', data)
          data = re.sub(r'keystore/debug_password\s*=.*', 'keystore/debug_password="android"', data)
          preset.write_text(data)
          print("Presets updated.")
          PY

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --export-debug "Android" build/FriendsBattleGround.apk
          test -s build/FriendsBattleGround.apk
          ls -lh build/FriendsBattleGround.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendsBattleGround-APK
          path: build/FriendsBattleGround.apk
          if-no-files-found: error
          
